name: ci
on:
  push:
  pull_request:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only deps
        run: pip install pytest
      - name: Run slice + conformance tests
        run: python -m pytest tests -q
